<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Survey — Curt Woodward</title>
    <link rel="stylesheet" href="stone.css" />
    <style>
        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 56px 44px 80px;
        }

        .survey-header {
            margin-bottom: 40px;
        }

        .survey-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 12px 0 16px;
        }

        .survey-header p {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-muted);
            max-width: 520px;
        }

        .form-embed-wrapper {
            border-radius: var(--r-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .form-embed-wrapper iframe {
            display: block;
            width: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .container { padding: 32px 20px 60px; }
            .survey-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <a href="index.html">← Curt Woodward</a>
    </nav>

    <div class="container">
        <div class="survey-header">
            <p class="eyebrow">Quick Survey</p>
            <h1>Tell Me About Newsletters</h1>
            <p>I'm researching the newsletter space — as products, as business models, and as reader experiences. Four quick questions, no wrong answers. Takes two minutes.</p>
        </div>

        <!-- ═══════════════════════════════════════════════════════════════
             PASTE YOUR GOOGLE FORM EMBED CODE BELOW.
             In Google Forms: Send → Embed (<>) → Copy HTML
             Replace the placeholder iframe with that code.
             Set the height to ~900 (adjust to taste).
             ═══════════════════════════════════════════════════════════════ -->
        <div class="form-embed-wrapper">
            <iframe
                src="https://docs.google.com/forms/d/e/1FAIpQLSded19i81bdzt4ItrrBMtj8JRo0X9QnwWYz6j_6rDq1JOEU3Q/viewform?embedded=true"
                width="100%"
                height="1500"
                frameborder="0"
                marginheight="0"
                marginwidth="0"
                title="Newsletter Survey">
                Loading survey…
            </iframe>
        </div>
        <!-- ═══════════════════════════════════════════════════════════════ -->

    </div>
</body>
</html>
